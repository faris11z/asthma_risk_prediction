name: Deploy to Hugging Face Spaces

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install huggingface_hub
        run: pip install huggingface_hub

      - name: Deploy to Hugging Face Spaces
        run: |
          python3 -c "
          from huggingface_hub import HfApi
          import os

          token = os.environ['HF_TOKEN']
          username = os.environ['HF_USERNAME']
          repo_id = f'{username}/asthma-risk-prediction'

          api = HfApi(token=token)

          # Create repo if it doesn't exist
          try:
              api.create_repo(
                  repo_id=repo_id,
                  repo_type='space',
                  space_sdk='gradio',
                  exist_ok=True
              )
              print(f'Space ready: {repo_id}')
          except Exception as e:
              print(f'Repo note: {e}')

          # Upload files (exclude .git, .github, __pycache__, Dockerfile, legacy dirs)
          api.upload_folder(
              folder_path='.',
              repo_id=repo_id,
              repo_type='space',
              ignore_patterns=[
                  '.git/**',
                  '.github/**',
                  '__pycache__/**',
                  '*.pyc',
                  'eval_plots/**',
                  'templates/**',
                  'web/**',
                  'Dockerfile',
                  '.dockerignore',
              ],
          )
          print(f'Deployed to https://{username}-asthma-risk-prediction.hf.space')
          "
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
