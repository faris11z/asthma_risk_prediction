name: Deploy to Hugging Face Spaces

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install huggingface_hub
        run: pip install huggingface_hub

      - name: Login to Hugging Face
        run: huggingface-cli login --token ${{ secrets.HF_TOKEN }}

      - name: Create Space (if not exists)
        run: |
          huggingface-cli repo create \
            --type space \
            --space-sdk docker \
            --private \
            asthma-risk-prediction || true
        env:
          HF_HUB_ENABLE_HF_TRANSFER: "1"

      - name: Deploy to Hugging Face Spaces
        run: |
          python3 -c "
          from huggingface_hub import HfApi
          import os

          api = HfApi()
          repo_id = os.environ.get('HF_USERNAME', '') + '/asthma-risk-prediction'

          # Create repo if it doesn't exist
          try:
              api.create_repo(repo_id=repo_id, repo_type='space', space_sdk='docker', exist_ok=True)
              print(f'Space ready: {repo_id}')
          except Exception as e:
              print(f'Repo creation note: {e}')

          # Upload files (exclude .git, .github, __pycache__)
          api.upload_folder(
              folder_path='.',
              repo_id=repo_id,
              repo_type='space',
              ignore_patterns=[
                  '.git/**',
                  '.github/**',
                  '__pycache__/**',
                  '*.pyc',
                  'eval_plots/**',
              ],
          )
          print(f'Deployed to https://{repo_id.replace(\"/\", \"-\")}.hf.space')
          "
        env:
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
