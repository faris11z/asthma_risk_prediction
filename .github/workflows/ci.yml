name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run evaluation pipeline
        run: python3 evaluate.py --fast

      - name: Verify model was regenerated
        run: test -f PEFR_predictor.joblib && echo "Model file exists" || (echo "Model file missing!" && exit 1)

      - name: Verify plots were generated
        run: |
          test -f myapp/eval_plots/feature_importance.png || (echo "feature_importance.png missing!" && exit 1)
          test -f myapp/eval_plots/pred_vs_actual.png    || (echo "pred_vs_actual.png missing!" && exit 1)
          test -f myapp/eval_plots/residuals.png         || (echo "residuals.png missing!" && exit 1)
          echo "All 3 plots verified"

      - name: Smoke test Gradio app
        run: |
          python3 app.py &
          sleep 5
          curl -sf http://127.0.0.1:7860/ | grep -q "Asthma Risk Prediction" && echo "Smoke test PASSED" || (echo "Smoke test FAILED" && exit 1)
          kill %1
